<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SL생산팀 DASH BOARD</title>
  <style>
    :root {
      --bg: #eef2f6;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe2ea;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --green: #047857;
      --green-soft: #ecfdf5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.4;
    }
    .hdr {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hdr-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: var(--ink);
    }
    .hdr-sub {
      font-size: 10.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .green-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }
    .toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 8px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 25;
    }
    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    .search-input {
      width: 260px;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 11.5px;
      outline: none;
    }
    .search-input:focus { border-color: var(--blue); }
    .c-btn {
      padding: 5px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      color: #334155;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .c-btn.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    select {
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      font-size: 11px;
      font-weight: 700;
      color: #1e293b;
    }
    .main-wrap {
      display: grid;
      grid-template-columns: 1fr 315px;
      gap: 12px;
      padding: 12px 18px 28px;
      max-width: 1800px;
      margin: 0 auto;
    }
    .box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      gap: 8px;
    }
    .box-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
    }
    .cnt-pill {
      background: #e2e8f0;
      color: #1e293b;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
    }
    .tbl-wrap {
      overflow-x: auto;
      max-height: calc(100vh - 150px);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.8px;
    }
    th {
      background: #2b3a4e;
      color: #fff;
      font-weight: 700;
      padding: 7px 5px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    td {
      padding: 6px 5px;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tr.jg-row td { background: #f8fbff; }
    td.c { text-align: center; white-space: nowrap; }
    td.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tag {
      display: inline-block;
      padding: 1.5px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      background: #f1f5f9;
      color: #334155;
    }
    .tag-car { background: #e0f2fe; color: #0369a1; }
    .tag-corner { background: #fef3c7; color: #b45309; }
    .eq-col { display: flex; flex-direction: column; gap: 2px; }
    .eq-badge {
      display: inline-block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    .formula-box {
      min-width: 260px;
      max-width: 400px;
      white-space: normal;
      line-height: 1.4;
      font-size: 10.6px;
      color: #1e293b;
    }
    .formula-star {
      color: #1d4ed8;
      font-weight: 700;
      margin-top: 2px;
    }
    .side-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 9px;
    }
    .side-tab {
      padding: 3px 8px;
      border-radius: 5px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .side-tab.active {
      background: #1d4ed8;
      color: #fff;
      border-color: #1d4ed8;
    }
    .p-banner {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 10px;
      margin-bottom: 8px;
    }
    .p-banner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .p-name { font-size: 13.5px; font-weight: 900; color: var(--ink); }
    .p-done {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
    }
    .p-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .sec-lbl {
      font-size: 10px;
      font-weight: 800;
      color: #475569;
      margin: 8px 0 5px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 7px;
      text-align: center;
    }
    .stat-k { font-size: 10px; color: var(--muted); font-weight: 700; }
    .stat-v { font-size: 14px; font-weight: 900; color: #1d4ed8; margin-top: 2px; }
    .stat-s { font-size: 9.5px; color: var(--muted); margin-top: 2px; }
    .item-list {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .detail-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 10.5px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-sub {
      padding-left: 10px;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 10px;
      padding-top: 2px;
    }
    @media (max-width: 1024px) {
      .main-wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>

          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </section>

  </div>

      const uniq = Array.from(new Set(DATA.allItems.map(d => d.item).filter(Boolean))).sort();
      const sel = document.getElementById('itemSelect');
      sel.innerHTML = '<option value="ALL">품목 전체 (ITEM)</option>' + uniq.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    function getArea(d) {
      const exact = DATA.area.find(a =>
        a.company === d.company &&
        a.car.toLowerCase() === d.car.toLowerCase() &&
        a.item.toLowerCase() === d.item.toLowerCase()
      );
      if (exact) return exact.area;
      if (d.car.includes('JG')) {
        const jg = DATA.area.find(a => a.company === d.company && a.car.toUpperCase().includes('JG'));
        if (jg) return jg.area;
      }
      const carOnly = DATA.area.find(a => a.company === d.company && a.car.toLowerCase() === d.car.toLowerCase());
      return carOnly ? carOnly.area : 0;
    }

    function getFilteredRows() {
      const q = state.search.trim().toLowerCase();
      return DATA.allItems.filter(d => {
        if (state.comp !== 'ALL' && d.company !== state.comp) return false;
        if (state.item !== 'ALL' && d.item !== state.item) return false;
        if (state.plant !== 'ALL' && d.plant !== state.plant) return false;
        if (q) {
          const eqStr = Object.entries(d.eqs || {}).map(([k, v]) => `${k} ${v}`).join(' ');
          const hay = `${d.company} ${d.plant} ${d.car} ${d.item} ${d.mat} ${d.eq_desc} ${eqStr}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderGrid() {
      const rows = getFilteredRows();
      document.getElementById('cntBadge').textContent = `총 ${rows.length}건`;
      const tbody = document.getElementById('gridBody');

      tbody.innerHTML = rows.map((d, i) => {
        const isJg = d.car.includes('JG');
        const eqEntries = Object.entries(d.eqs || {});
        const eqHtml = eqEntries.length
          ? eqEntries.map(([k, v]) => `<div class="eq-badge">• ${k} : ${v}대</div>`).join('')
          : '<span class="tag">-</span>';

        const desc = d.eq_desc || '';
        const bIdx = desc.indexOf('[');
        const mainPart = bIdx >= 0 ? desc.slice(0, bIdx).trim() : desc.trim();
        const starPart = bIdx >= 0 ? desc.slice(bIdx).trim() : '';

        const lines = mainPart
          ? mainPart.split(/\s+\/\s+/).map(s => `<div>• ${s.trim()}</div>`).join('')
          : '<div>• -</div>';

        const areaVal = getArea(d);
        const p25 = DATA.perf25_26['2025'][d.company] || 0;
        const matHtml = d.mat.split('\n').join('<br/>');

        return `
          <tr class="${isJg ? 'jg-row' : ''}">
            <td class="c">${i + 1}</td>
            <td class="c"><strong>${d.company}</strong></td>
            <td class="c"><span class="tag">${d.plant}</span></td>
            <td class="c"><span class="tag tag-car">${d.car}</span></td>
            <td class="c"><strong>${d.item}</strong></td>
            <td class="c">${matHtml}</td>
            <td class="c"><span class="tag tag-corner">${d.corner}</span></td>
            <td class="c"><strong>${d.set}</strong></td>
            <td><div class="eq-col">${eqHtml}</div></td>
            <td>
              <div class="formula-box">
                ${lines}
                ${starPart ? `<div class="formula-star">★ ${starPart}</div>` : ''}
              </div>
            </td>
            <td class="c"><strong>${fmt(d.eq_total)} 대</strong></td>
            <td class="r">${areaVal ? areaVal.toFixed(1) + ' 평' : '-'}</td>
            <td class="r">${p25 ? fmt(Math.round(p25)) + '원' : '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function renderSide() {
      const p = state.sideComp;
      const wRows = DATA.inwon.filter(w => w.partner.includes(p));
      const totW = wRows.reduce((s, w) => s + w.total, 0);
      const mgrW = wRows.reduce((s, w) => s + w.manager, 0);
      const domW = wRows.reduce((s, w) => s + w.domestic, 0);
      const fLeg = wRows.reduce((s, w) => s + w.foreign_legal, 0);
      const fIll = wRows.reduce((s, w) => s + w.foreign_illegal, 0);
      const fSub = wRows.reduce((s, w) => s + w.foreign_subtotal, 0);

      const areaSum = DATA.area.filter(a => a.company === p).reduce((s, a) => s + (a.area || 0), 0);
      const cItems = DATA.allItems.filter(d => d.company === p);
      const itemCnt = cItems.length;
      const eqSum = cItems.reduce((s, d) => s + (d.eq_total || 0), 0);
      const uniqItems = Array.from(new Set(cItems.map(d => d.item)));

      const p25 = DATA.perf25_26['2025'][p] || 0;
      const p26 = DATA.perf25_26['2026'][p] || 0;

      document.getElementById('sideBody').innerHTML = `
        <div class="p-banner">
          <div class="p-banner-top">
            <span class="p-name">${p}</span>
            <span class="p-done">완료 (${itemCnt}품목)</span>
          </div>
          <div class="p-sub">거점 구분: ${wRows.map(w => w.partner).join(', ') || p}</div>
        </div>

        <div class="sec-lbl">I 대분류·업체 핵심 지표 (총괄)</div>
        <div class="grid-2">
          <div class="stat-card">
            <div class="stat-k">① 총 인원</div>
            <div class="stat-v">${fmt(totW)} 명</div>
            <div class="stat-s">관리 ${fmt(mgrW)} · 생산 ${fmt(totW - mgrW)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-k">② 등록 면적</div>
            <div class="stat-v">${areaSum.toFixed(1)} 평</div>
            <div class="stat-s">사업장 총괄 기준</div>
          </div>
          <div class="stat-card">
            <div class="stat-k">③ 임가공비 (25년 연간)</div>
            <div class="stat-v">${fmt(Math.round(p25))}원</div>
            <div class="stat-s">26년(1~8월): ${fmt(Math.round(p26))}원</div>
          </div>
          <div class="stat-card">
            <div class="stat-k">④ 총 설비대수</div>
            <div class="stat-v">${fmt(eqSum)} 대</div>
            <div class="stat-s">조인트·성형 설비 계</div>
          </div>
        </div>

        <div class="sec-lbl">III 주요 아이템 (${uniqItems.length}종)</div>
        <div class="item-list">
          ${uniqItems.map(i => `<span class="tag tag-car">${i}</span>`).join('')}
        </div>

        <div class="sec-lbl">I 중분류·인원 세부 구성 내역</div>
        <div class="detail-box">
          <div class="detail-row"><span>• 관리자</span><strong>${fmt(mgrW)} 명</strong></div>
          <div class="detail-row"><span>• 내국인 (생산직)</span><strong>${fmt(domW)} 명</strong></div>
          <div class="detail-row"><span>• 외국인 소계</span><strong>${fmt(fSub)} 명</strong></div>
          <div class="detail-sub">└ 합법 ${fmt(fLeg)}명 / 불법 ${fmt(fIll)}명 세부</div>
        </div>
      `;
    }

    function syncSideTabs() {
      document.querySelectorAll('.side-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.p === state.sideComp);
      });
    }

    document.querySelectorAll('.c-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.c-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.comp = btn.dataset.comp;
        if (state.comp !== 'ALL') {
          state.sideComp = state.comp;
          syncSideTabs();
        }
        renderGrid();
        renderSide();
      });
    });

    document.querySelectorAll('.side-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.sideComp = tab.dataset.p;
        syncSideTabs();
        renderSide();
      });
    });

    document.getElementById('itemSelect').addEventListener('change', (e) => {
      state.item = e.target.value;
      renderGrid();
    });

    document.getElementById('plantSelect').addEventListener('change', (e) => {
      state.plant = e.target.value;
      renderGrid();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderGrid();
    });

    initItems();
    renderGrid();
    renderSide();

  </script>
</body>
</html>
